<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>포켓몬 200층 배틀 타워 (1~4세대)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700&display=swap');

  * { box-sizing: border-box; user-select: none; }
  body {
    background-color: #1a1a2e;
    color: #fff;
    font-family: 'Noto Sans KR', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  #game-container {
    width: 800px;
    background: #16213e;
    border: 4px solid #e94560;
    border-radius: 12px;
    box-shadow: 0 0 25px rgba(233, 69, 96, 0.4);
    overflow: hidden;
  }
  header {
    background: #0f3460;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 3px solid #e94560;
  }
  .wave-badge {
    background: #e94560;
    padding: 5px 12px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 16px;
  }
  .boss-alert {
    background: #f39c12;
    color: #000;
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

  /* 화면 전환용 */
  .screen { display: none; padding: 20px; }
  .screen.active { display: block; }

  /* 계정 로그인/생성 화면 스타일 */
  #auth-screen { text-align: center; padding: 40px 20px; }
  .auth-box {
    background: #0f3460;
    border: 2px solid #533483;
    padding: 30px;
    border-radius: 10px;
    display: inline-block;
    width: 400px;
  }
  .auth-box input {
    width: 100%;
    padding: 12px;
    margin: 15px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 16px;
    text-align: center;
  }
  .auth-box button {
    width: 100%;
    background: #e94560;
    color: white;
    padding: 12px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }

  /* 스타팅 선택 화면 */
  .starter-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 15px;
    max-height: 400px;
    overflow-y: auto;
  }
  .starter-card {
    background: #0f3460;
    border: 2px solid #533483;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
  }
  .starter-card.locked {
    background: #111827;
    border-color: #374151;
    opacity: 0.5;
    cursor: not-allowed;
  }
  .starter-card:hover:not(.locked) {
    border-color: #e94560;
    transform: translateY(-3px);
  }
  .starter-card img {
    width: 80px;
    height: 80px;
    image-rendering: pixelated;
  }

  /* 배틀 필드 */
  #battle-field {
    position: relative;
    height: 320px;
    background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 55%, #7ec850 55%, #567d46 100%);
    border-radius: 8px;
    border: 3px solid #333;
    overflow: hidden;
    color: #000;
  }
  .status-box {
    position: absolute;
    background: rgba(255, 255, 255, 0.92);
    border: 3px solid #2c3e50;
    border-radius: 8px;
    padding: 8px 12px;
    width: 260px;
    box-shadow: 3px 3px 0px rgba(0,0,0,0.3);
  }
  #enemy-status { top: 20px; left: 20px; }
  #player-status { bottom: 20px; right: 20px; }

  .poke-header {
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 4px;
  }
  .types { display: flex; gap: 4px; margin-bottom: 5px; }
  .type-badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    color: #fff;
    font-weight: bold;
    text-shadow: 1px 1px 1px rgba(0,0,0,0.5);
  }
  .hp-bar-bg {
    width: 100%;
    height: 10px;
    background: #ccc;
    border-radius: 5px;
    overflow: hidden;
    border: 1px solid #333;
  }
  .hp-bar {
    height: 100%;
    background: #2ecc71;
    width: 100%;
    transition: width 0.3s, background-color 0.3s;
  }
  .exp-bar-bg {
    width: 100%;
    height: 5px;
    background: #ddd;
    margin-top: 4px;
  }
  .exp-bar {
    height: 100%;
    background: #3498db;
    width: 0%;
    transition: width 0.3s;
  }

  .sprite {
    position: absolute;
    width: 140px;
    height: 140px;
    image-rendering: pixelated;
    transition: transform 0.1s;
  }
  #enemy-sprite { top: 45px; right: 70px; }
  #player-sprite { bottom: 15px; left: 70px; transform: scale(1.2); }

  /* 로그 및 컨트롤 */
  #log-box {
    background: #0f3460;
    border: 2px solid #533483;
    border-radius: 8px;
    height: 110px;
    margin-top: 12px;
    padding: 10px;
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.5;
  }
  .controls {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 12px;
    margin-top: 12px;
  }
  .moves-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  button {
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    padding: 10px;
    cursor: pointer;
    font-size: 14px;
    transition: 0.15s;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .move-btn {
    color: #fff;
    text-align: left;
    display: flex;
    flex-direction: column;
    border: 2px solid rgba(255,255,255,0.2);
  }
  .move-btn:hover:not(:disabled) { filter: brightness(1.15); }
  .action-panel {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .btn-heal { background: #27ae60; color: white; padding: 8px; }
  .btn-ball { background: #e74c3c; color: white; padding: 8px; }
  .btn-party { background: #8e44ad; color: white; padding: 8px; }
  .btn-save { background: #2980b9; color: white; font-size: 12px; padding: 6px; }
  .btn-home { background: #c0392b; color: white; font-size: 12px; padding: 6px; }

  /* 모달 */
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  .modal-content {
    background: #16213e;
    border: 3px solid #e94560;
    padding: 20px;
    border-radius: 10px;
    width: 420px;
    text-align: center;
  }
  .modal-list { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
</style>
</head>
<body>

<div id="game-container">
  <header>
    <div><strong>POKÉMON TOWER 200</strong> <span id="user-display" style="font-size:12px; color:#f1c40f; margin-left:10px;"></span></div>
    <div id="wave-display" class="wave-badge">준비 중</div>
    <div id="money-display">소지금: 3000원</div>
  </header>

  <!-- 0. 계정 로그인/생성 화면 -->
  <div id="auth-screen" class="screen active">
    <div class="auth-box">
      <h2>포켓몬 트레이너 등록</h2>
      <p style="font-size:13px; color:#ccc;">닉네임을 입력하여 계정을 만들거나 불러오세요.</p>
      <input type="text" id="username-input" placeholder="트레이너 닉네임 입력" maxlength="12">
      <button onclick="loginUser()">모험 시작하기 / 이어하기</button>
    </div>
  </div>

  <!-- 1. 스타팅 선택 화면 -->
  <div id="starter-screen" class="screen">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="margin:0;">파트너 포켓몬 선택</h2>
      <button onclick="logoutUser()" style="background:#c0392b; color:#fff; padding:6px 12px; font-size:12px;">계정 변경</button>
    </div>
    <p style="font-size:13px; color:#ccc; margin-top:8px;">잡은 포켓몬은 다음 판 스타팅으로 해제됩니다. 저장된 세이브가 있다면 이어할 수 있습니다!</p>
    <div style="display:flex; gap:10px; margin-bottom:10px;">
      <button onclick="startNewRun()" style="background:#27ae60; color:#fff; flex:1; padding:8px;">새 게임 시작 (1층부터)</button>
      <button id="btn-continue" onclick="continueGame()" style="background:#f39c12; color:#000; flex:1; padding:8px; display:none;">이어서 하기 (<span id="saved-wave-text">0</span>층)</button>
    </div>
    <div class="starter-grid" id="starter-list"></div>
  </div>

  <!-- 2. 배틀 화면 -->
  <div id="battle-screen" class="screen">
    <div id="battle-field">
      <!-- 적 상태창 -->
      <div id="enemy-status" class="status-box">
        <div class="poke-header">
          <span id="enemy-name">이름</span>
          <span id="enemy-lv">Lv.5</span>
        </div>
        <div class="types" id="enemy-types"></div>
        <div class="hp-bar-bg"><div id="enemy-hp-bar" class="hp-bar"></div></div>
        <div style="font-size:11px; text-align:right; margin-top:2px;" id="enemy-hp-text">20/20</div>
      </div>
      <img id="enemy-sprite" class="sprite" src="" alt="enemy">

      <!-- 내 포켓몬 상태창 -->
      <div id="player-status" class="status-box">
        <div class="poke-header">
          <span id="player-name">이름</span>
          <span id="player-lv">Lv.5</span>
        </div>
        <div class="types" id="player-types"></div>
        <div class="hp-bar-bg"><div id="player-hp-bar" class="hp-bar"></div></div>
        <div style="font-size:11px; display:flex; justify-content:space-between; margin-top:2px;">
          <span>EXP</span>
          <span id="player-hp-text">20/20</span>
        </div>
        <div class="exp-bar-bg"><div id="player-exp-bar" class="exp-bar"></div></div>
      </div>
      <img id="player-sprite" class="sprite" src="" alt="player">
    </div>

    <div id="log-box"></div>

    <div class="controls">
      <div class="moves-grid" id="moves-container"></div>
      <div class="action-panel">
        <button class="btn-heal" onclick="usePotion()">상처약 (500원 / HP 50%)</button>
        <button class="btn-ball" id="btn-catch" onclick="throwPokeball()">몬스터볼 (300원)</button>
        <button class="btn-party" onclick="openPartyModal(false)">교체 (<span id="party-count">1</span>/6)</button>
        <button class="btn-save" onclick="manualSave()">게임 수동 저장</button>
        <button class="btn-home" onclick="goToHome()">처음 화면으로 (로그아웃)</button>
      </div>
    </div>
  </div>
</div>

<!-- 기술 습득 / 포켓몬 교체 모달 -->
<div id="modal" class="modal">
  <div class="modal-content">
    <h3 id="modal-title">제목</h3>
    <p id="modal-desc" style="font-size:13px;"></p>
    <div class="modal-list" id="modal-list"></div>
  </div>
</div>

<script>
// ==========================================
// 1. 타입 상성표 및 데이터베이스
// ==========================================
const TYPE_COLORS = {
  '노말': '#A8A77A', '불꽃': '#EE8130', '물': '#6390F0', '풀': '#7AC74C',

  '바위': { '불꽃': 2, '얼음': 2, '격투': 0.5, '땅': 0.5, '비행': 2, '벌레': 2, '강철': 0.5 },
  '고스트': { '노말': 0, '에스퍼': 2, '고스트': 2, '악': 0.5, '강철': 0.5 },
  '드래곤': { '드래곤': 2, '강철': 0.5 },
  '악': { '격투': 0.5, '에스퍼': 2, '고스트': 2, '악': 0.5, '강철': 0.5 },

};

function getTypeEffectiveness(moveType, defTypes) {
  let mult = 1;
  for (const dt of defTypes) {
    if (TYPE_CHART[moveType] && TYPE_CHART[moveType][dt] !== undefined) {
      mult *= TYPE_CHART[moveType][dt];
    }
  }
  return mult;
}

// ==========================================
let currentUser = null;
let state = {
  wave: 1,
  money: 3000,
  party: [],
  activeIdx: 0,
  enemy: null,
  isBusy: false
};

function getDBKey(key) {
  return `poke_db_${currentUser}_${key}`;
}

function loginUser() {
  const input = document.getElementById('username-input').value.trim();
  if (!input) {
    alert('트레이너 닉네임을 입력해주세요!');
    return;
  }
  currentUser = input;
  document.getElementById('user-display').innerText = `[트레이너: ${currentUser}]`;
  
  if (!localStorage.getItem(getDBKey('unlocked'))) {
    let defaults = [];
    Object.entries(POKEDEX).forEach(([id, data]) => {
      if (data.starter) defaults.push(Number(id));
    });
    localStorage.setItem(getDBKey('unlocked'), JSON.stringify(defaults));
  }

  document.getElementById('auth-screen').classList.remove('active');
  document.getElementById('starter-screen').classList.add('active');
  checkSavedGame();
  renderStarterList();
}

function logoutUser() {
  currentUser = null;
  document.getElementById('starter-screen').classList.remove('active');
  document.getElementById('auth-screen').classList.add('active');
}

function goToHome() {
  if (confirm('현재 진행 상황이 자동 저장되어 있습니다. 처음 화면(로그인 화면)으로 돌아가시겠습니까?')) {
    manualSave(); // 나가기 전 안전 저장
    document.getElementById('battle-screen').classList.remove('active');
    document.getElementById('auth-screen').classList.add('active');
    document.getElementById('user-display').innerText = '';
  }
}

function getUnlockedStarters() {
  let saved = localStorage.getItem(getDBKey('unlocked'));
  return saved ? JSON.parse(saved) : [];
}

function unlockStarter(dexId) {
  let unlocked = getUnlockedStarters();
  if (!unlocked.includes(dexId)) {
    unlocked.push(dexId);
    localStorage.setItem(getDBKey('unlocked'), JSON.stringify(unlocked));
  }
}

function autoSave() {
  const saveData = {
    wave: state.wave,
    money: state.money,
    party: state.party,
    activeIdx: state.activeIdx
  };
  localStorage.setItem(getDBKey('save'), JSON.stringify(saveData));
  log(`<span style="color:#3498db;">[자동 저장] ${state.wave}층 진행 상황이 저장되었습니다.</span>`);
}

function manualSave() {
  const saveData = {
    wave: state.wave,
    money: state.money,
    party: state.party,
    activeIdx: state.activeIdx
  };
  localStorage.setItem(getDBKey('save'), JSON.stringify(saveData));
  log(`<span style="color:#2ecc71;">[수동 저장 완료] 현재 ${state.wave}층 기록이 저장되었습니다!</span>`);
}

function checkSavedGame() {
  const saved = localStorage.getItem(getDBKey('save'));
  const btn = document.getElementById('btn-continue');
  if (saved) {
    const data = JSON.parse(saved);
    document.getElementById('saved-wave-text').innerText = data.wave;
    btn.style.display = 'block';
  } else {
    btn.style.display = 'none';
  }
}

function createPokemon(dexId, level) {
  const base = POKEDEX[dexId];
  const calcHP = (b, lv) => Math.floor(((b * 2 + 15) * lv) / 100) + lv + 10;
  const calcStat = (b, lv) => Math.floor(((b * 2 + 15) * lv) / 100) + 5;

  let learned = [];
  const levels = Object.keys(base.learnset).map(Number).sort((a, b) => a - b);
  for (const lv of levels) {
    if (lv <= level) {
      for (const m of base.learnset[lv]) {
        if (!learned.includes(m)) {
          if (learned.length >= 4) learned.shift();
          learned.push(m);
        }
      }
    }
  }

  const maxHp = calcHP(base.stats.hp, level);
  return {
    dexId,
    name: base.name,
    types: [...base.types],
    level,
    exp: 0,
    nextExp: level * level * 15,
    maxHp,
    hp: maxHp,
    atk: calcStat(base.stats.atk, level),
    def: calcStat(base.stats.def, level),
    spa: calcStat(base.stats.spa, level),
    spd: calcStat(base.stats.spd, level),
    spe: calcStat(base.stats.spe, level),
    moves: learned
  };
}

function recalculateStats(poke) {
  const base = POKEDEX[poke.dexId];
  const oldMax = poke.maxHp;
  poke.maxHp = Math.floor(((base.stats.hp * 2 + 15) * poke.level) / 100) + poke.level + 10;
  poke.hp += (poke.maxHp - oldMax);
  poke.atk = Math.floor(((base.stats.atk * 2 + 15) * poke.level) / 100) + 5;
  poke.def = Math.floor(((base.stats.def * 2 + 15) * poke.level) / 100) + 5;
  poke.spa = Math.floor(((base.stats.spa * 2 + 15) * poke.level) / 100) + 5;
  poke.spd = Math.floor(((base.stats.spd * 2 + 15) * poke.level) / 100) + 5;
  poke.spe = Math.floor(((base.stats.spe * 2 + 15) * poke.level) / 100) + 5;
}

function getSpriteUrl(dexId, isBack = false) {
  const dir = isBack ? 'back/' : '';
  return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${dir}${dexId}.png`;
}

// ==========================================
// 3. 스타팅 선택 및 게임 시작
// ==========================================
function renderStarterList() {
  const list = document.getElementById('starter-list');
  list.innerHTML = '';
  const unlocked = getUnlockedStarters();

  Object.entries(POKEDEX).forEach(([id, data]) => {
    const dexNum = Number(id);
    const isUnlocked = unlocked.includes(dexNum);

    const card = document.createElement('div');
    card.className = isUnlocked ? 'starter-card' : 'starter-card locked';
    card.innerHTML = `
      <div style="font-size:11px; color:#aaa;">${data.gen}세대 ${isUnlocked ? '' : '🔒 (미해제)'}</div>
      <img src="${getSpriteUrl(id)}" alt="${data.name}">
      <div><strong>${data.name}</strong></div>
      <div class="types" style="justify-content:center; margin-top:4px;">
        ${data.types.map(t => `<span class="type-badge" style="background:${TYPE_COLORS[t]}">${t}</span>`).join('')}
      </div>
    `;

    if (isUnlocked) {
      card.onclick = () => startNewRunStarter(dexNum);
    }
    list.appendChild(card);
  });
}

function startNewRun() {
  alert('원하는 스타팅 포켓몬을 아래 목록에서 클릭하세요!');
}

function startNewRunStarter(starterId) {
  state.party = [createPokemon(starterId, 5)];
  state.activeIdx = 0;
  state.wave = 1;
  state.money = 3000;

  localStorage.removeItem(getDBKey('save'));

  document.getElementById('starter-screen').classList.remove('active');
  document.getElementById('battle-screen').classList.add('active');
  spawnWave();
}

function continueGame() {
  const saved = localStorage.getItem(getDBKey('save'));
  if (!saved) return;
  const data = JSON.parse(saved);
  state.wave = data.wave;
  state.money = data.money;
  state.party = data.party;
  state.activeIdx = data.activeIdx;

  document.getElementById('starter-screen').classList.remove('active');
  document.getElementById('battle-screen').classList.add('active');
  spawnWave();
}

function log(msg) {
  const box = document.getElementById('log-box');
  box.innerHTML += `<div>▶ ${msg}</div>`;
  box.scrollTop = box.scrollHeight;
}

// ==========================================
// 4. 웨이브 및 배틀 진행
// ==========================================
function spawnWave() {
  if (state.wave > 200) {
    alert('축하합니다! 200층 모든 웨이브를 정복했습니다!');
    location.reload();
    return;
  }

  autoSave();

  const isBoss = (state.wave % 10 === 0);
  const waveEl = document.getElementById('wave-display');
  waveEl.innerText = isBoss ? `★ ${state.wave}층 BOSS ★` : `${state.wave}층 / 200층`;
  waveEl.className = isBoss ? 'wave-badge boss-alert' : 'wave-badge';

  const allIds = Object.keys(POKEDEX).map(Number);
  const normalIds = allIds.filter(id => !POKEDEX[id].boss);

  const earlyBosses = [59, 130, 143];
  const midBosses = [149, 248, 373, 376, 445];
  const lateBosses = [150, 249, 250, 382, 383, 384, 483, 484, 487];

  let enemyId, enemyLv;
  if (isBoss) {
    const bossTier = Math.floor(state.wave / 10) - 1;
    if (state.wave <= 30) {
      enemyId = earlyBosses[bossTier % earlyBosses.length];
      enemyLv = Math.floor(state.wave * 0.5) + 3;
    } else if (state.wave <= 80) {
      enemyId = midBosses[(bossTier - 3) % midBosses.length];
      enemyLv = Math.min(100, Math.floor(state.wave * 0.52) + 4);
    } else {
      enemyId = lateBosses[(bossTier - 8) % lateBosses.length];
      enemyLv = Math.min(100, Math.floor(state.wave * 0.55) + 5);
    }
  } else {
    enemyId = normalIds[Math.floor(Math.random() * normalIds.length)];
    enemyLv = Math.min(100, Math.floor(state.wave * 0.5) + 3);
  }

  state.enemy = createPokemon(enemyId, enemyLv);
  if (isBoss) {
    const hpMult = state.wave <= 30 ? 1.0 : (state.wave <= 80 ? 1.25 : 1.5);
    state.enemy.maxHp = Math.floor(state.enemy.maxHp * hpMult);
    state.enemy.hp = state.enemy.maxHp;
  }

  if (isBoss) {
    log(`<span style="color:#f39c12; font-weight:bold;">[보스 출현!] ${state.wave}층의 수호자 ${state.enemy.name}(Lv.${enemyLv})가 나타났다!</span>`);
  } else {
    log(`야생의 ${state.enemy.name}(Lv.${enemyLv})이(가) 나타났다!`);
  }

  document.getElementById('btn-catch').disabled = isBoss;
  state.isBusy = false;
  updateUI();
}

function updateUI() {
  const p = state.party[state.activeIdx];
  const e = state.enemy;

  document.getElementById('money-display').innerText = `소지금: ${state.money}원`;
  document.getElementById('party-count').innerText = state.party.length;

  document.getElementById('enemy-name').innerText = e.name;
  document.getElementById('enemy-lv').innerText = `Lv.${e.level}`;
  document.getElementById('enemy-types').innerHTML = e.types.map(t =>
    `<span class="type-badge" style="background:${TYPE_COLORS[t]}">${t}</span>`).join('');
  document.getElementById('enemy-hp-text').innerText = `${Math.max(0, e.hp)}/${e.maxHp}`;
  const ePct = Math.max(0, (e.hp / e.maxHp) * 100);
  const eBar = document.getElementById('enemy-hp-bar');
  eBar.style.width = `${ePct}%`;
  eBar.style.backgroundColor = ePct > 50 ? '#2ecc71' : ePct > 20 ? '#f1c40f' : '#e74c3c';
  document.getElementById('enemy-sprite').src = getSpriteUrl(e.dexId, false);

  document.getElementById('player-name').innerText = p.name;
  document.getElementById('player-lv').innerText = `Lv.${p.level}`;
  document.getElementById('player-types').innerHTML = p.types.map(t =>
    `<span class="type-badge" style="background:${TYPE_COLORS[t]}">${t}</span>`).join('');
  document.getElementById('player-hp-text').innerText = `${Math.max(0, p.hp)}/${p.maxHp}`;
  const pPct = Math.max(0, (p.hp / p.maxHp) * 100);
  const pBar = document.getElementById('player-hp-bar');
  pBar.style.width = `${pPct}%`;
  pBar.style.backgroundColor = pPct > 50 ? '#2ecc71' : pPct > 20 ? '#f1c40f' : '#e74c3c';
  document.getElementById('player-exp-bar').style.width = `${Math.min(100, (p.exp / p.nextExp) * 100)}%`;
  document.getElementById('player-sprite').src = getSpriteUrl(p.dexId, true);

  const movesDiv = document.getElementById('moves-container');
  movesDiv.innerHTML = '';
  p.moves.forEach(mName => {
    const m = MOVES[mName];
    const eff = getTypeEffectiveness(m.type, e.types);
    let effText = '';
    if (eff > 1) effText = ' (효과 굉장!)';
    else if (eff === 0) effText = ' (효과 없음)';
    else if (eff < 1) effText = ' (효과 별로)';

    const btn = document.createElement('button');
    btn.className = 'move-btn';
    btn.style.backgroundColor = TYPE_COLORS[m.type];
    btn.disabled = state.isBusy;
    btn.innerHTML = `
      <span>${mName} <small>[${m.type}/${m.cat}]</small></span>
      <small>위력: ${m.power} | 명중: ${m.acc}${effText}</small>
    `;
    btn.onclick = () => executeTurn(mName);
    movesDiv.appendChild(btn);
  });
}

function calculateDamage(attacker, defender, moveName) {
  const move = MOVES[moveName];
  if (Math.random() * 100 > move.acc) return { damage: 0, missed: true, eff: 1 };

  const eff = getTypeEffectiveness(move.type, defender.types);
  if (eff === 0) return { damage: 0, missed: false, eff: 0 };

  const A = move.cat === '물리' ? attacker.atk : attacker.spa;
  const D = move.cat === '물리' ? defender.def : defender.spd;
  const stab = attacker.types.includes(move.type) ? 1.5 : 1.0;
  const random = (Math.floor(Math.random() * 16) + 85) / 100;

  let dmg = Math.floor((((2 * attacker.level / 5 + 2) * move.power * (A / D)) / 50 + 2) * stab * eff * random);
  return { damage: Math.max(1, dmg), missed: false, eff };
}

async function executeTurn(playerMoveName) {
  if (state.isBusy) return;
  state.isBusy = true;
  updateUI();

  const p = state.party[state.activeIdx];
  const e = state.enemy;
  const enemyMoveName = e.moves[Math.floor(Math.random() * e.moves.length)];

  const playerFirst = p.spe >= e.spe;

  if (playerFirst) {
    await performAttack(p, e, playerMoveName, true);
    if (e.hp > 0) await performAttack(e, p, enemyMoveName, false);
  } else {
    await performAttack(e, p, enemyMoveName, false);
    if (p.hp > 0) await performAttack(p, e, playerMoveName, true);
  }

  await checkBattleEnd();
}

function performAttack(attacker, defender, moveName, isPlayer) {
  return new Promise(resolve => {
    const prefix = isPlayer ? `${attacker.name}의` : `적 ${attacker.name}의`;
    log(`${prefix} <strong>${moveName}</strong>!`);

    const res = calculateDamage(attacker, defender, moveName);
    if (res.missed) {
      log(`그러나 빗나갔다!`);
    } else if (res.eff === 0) {
      log(`${defender.name}에게는 효과가 없는 듯하다...`);
    } else {
      defender.hp = Math.max(0, defender.hp - res.damage);
      if (res.eff > 1) log(`<span style="color:#2ecc71;">효과가 굉장했다!</span> (${res.damage} 데미지)`);
      else if (res.eff < 1) log(`<span style="color:#95a5a6;">효과가 별로인 듯하다...</span> (${res.damage} 데미지)`);
      else log(`${res.damage}의 데미지를 입혔다!`);
    }

    updateUI();
    setTimeout(resolve, 700);
  });
}

async function checkBattleEnd() {
  const p = state.party[state.activeIdx];
  const e = state.enemy;

  if (e.hp <= 0) {
    log(`<strong>적 ${e.name}은(는) 쓰러졌다!</strong>`);
    
    const isBossWave = (state.wave % 10 === 0);
    const baseReward = 200 + (state.wave * 80);
    const rewardMoney = isBossWave ? baseReward * 3 : baseReward;
    
    state.money += rewardMoney;
    log(`<span style="color:#f1c40f;">상금 ${rewardMoney}원을 획득했다!</span>`);

    const gainedExp = e.level * (isBossWave ? 45 : 22);
    await gainExp(p, gainedExp);

    state.party.forEach(poke => {
      if (poke.hp > 0) poke.hp = Math.min(poke.maxHp, poke.hp + Math.floor(poke.maxHp * 0.2));
    });

    state.wave++;
    setTimeout(spawnWave, 1000);
  } else if (p.hp <= 0) {
    log(`<span style="color:#e74c3c;">${p.name}은(는) 쓰러졌다!</span>`);
    const aliveIdx = state.party.findIndex(poke => poke.hp > 0);
    if (aliveIdx === -1) {
      alert(`게임 오버! 최종 도달 층수: ${state.wave}층`);
      localStorage.removeItem(getDBKey('save'));
      location.reload();
    } else {
      openPartyModal(true);
    }
  } else {
    state.isBusy = false;
    updateUI();
  }
}

async function gainExp(poke, amount) {
  if (poke.level >= 100) return;
  poke.exp += amount;
  log(`${poke.name}은(는) ${amount} 경험치를 얻었다!`);

  while (poke.exp >= poke.nextExp && poke.level < 100) {
    poke.exp -= poke.nextExp;
    poke.level++;
    poke.nextExp = poke.level * poke.level * 15;
    recalculateStats(poke);
    log(`<span style="color:#3498db; font-weight:bold;">레벨 업! ${poke.name}은(는) Lv.${poke.level}이(가) 되었다!</span>`);
    updateUI();

    const learnset = POKEDEX[poke.dexId].learnset;
    if (learnset[poke.level]) {
      for (const newMove of learnset[poke.level]) {
        if (!poke.moves.includes(newMove)) {
          await handleLearnMove(poke, newMove);
        }
      }
    }
  }
}

function handleLearnMove(poke, newMove) {
  return new Promise(resolve => {
    if (poke.moves.length < 4) {
      poke.moves.push(newMove);
      log(`<span style="color:#f1c40f;">${poke.name}은(는) 새로 <strong>${newMove}</strong>을(를) 배웠다!</span>`);
      updateUI();
      resolve();
    } else {
      const modal = document.getElementById('modal');
      document.getElementById('modal-title').innerText = `새 기술 습득: ${newMove}`;
      const mInfo = MOVES[newMove];
      document.getElementById('modal-desc').innerText =
        `${poke.name}이(가) ${newMove} [${mInfo.type}/${mInfo.cat}, 위력:${mInfo.power}]을(를) 배우려 합니다. 잊을 기술을 선택하세요.`;

      const list = document.getElementById('modal-list');
      list.innerHTML = '';

      poke.moves.forEach((oldMove, idx) => {
        const om = MOVES[oldMove];
        const btn = document.createElement('button');
        btn.style.background = TYPE_COLORS[om.type];
        btn.style.color = '#fff';
        btn.innerText = `${oldMove} [${om.type}/${om.cat}, 위력:${om.power}] 잊기`;
        btn.onclick = () => {
          poke.moves[idx] = newMove;
          log(`${poke.name}은(는) ${oldMove}을(를) 잊고 <strong>${newMove}</strong>을(를) 배웠다!`);
          modal.style.display = 'none';
          updateUI();
          resolve();
        };
        list.appendChild(btn);
      });

      const cancelBtn = document.createElement('button');
      cancelBtn.style.background = '#555';
      cancelBtn.style.color = '#fff';
      cancelBtn.innerText = `${newMove} 습득 포기하기`;
      cancelBtn.onclick = () => {
        log(`${poke.name}은(는) ${newMove}을(를) 배우지 않았다.`);
        modal.style.display = 'none';
        resolve();
      };
      list.appendChild(cancelBtn);

      modal.style.display = 'flex';
    }
  });
}

function usePotion() {
  if (state.isBusy) return;
  if (state.money < 500) { log('소지금이 부족합니다! (500원 필요)'); return; }
  const p = state.party[state.activeIdx];
  if (p.hp >= p.maxHp) { log('이미 체력이 가득 차 있습니다.'); return; }

  state.money -= 500;
  const heal = Math.floor(p.maxHp * 0.5);
  p.hp = Math.min(p.maxHp, p.hp + heal);
  log(`상처약을 사용해 ${p.name}의 체력을 ${heal} 회복했다!`);
  updateUI();
}

async function throwPokeball() {
  if (state.isBusy) return;
  if (state.party.length >= 6) { log('지닌 포켓몬이 이미 6마리입니다!'); return; }
  if (state.money < 300) { log('소지금이 부족합니다! (300원 필요)'); return; }

  state.isBusy = true;
  state.money -= 300;
  updateUI();

  const e = state.enemy;
  log(`몬스터볼을 던졌다!`);

  const hpRatio = e.hp / e.maxHp;
  const catchChance = Math.max(0.15, (1 - hpRatio * 0.8));

  await new Promise(r => setTimeout(r, 800));
  if (Math.random() < catchChance) {
    log(`<span style="color:#f1c40f; font-weight:bold;">신난다! ${e.name}을(를) 잡았다!</span>`);
    unlockStarter(e.dexId);
    state.party.push(e);
    state.wave++;
    setTimeout(spawnWave, 1000);
  } else {
    log(`아깝다! 볼에서 튀어나왔다!`);
    const p = state.party[state.activeIdx];
    const enemyMoveName = e.moves[Math.floor(Math.random() * e.moves.length)];
    await performAttack(e, p, enemyMoveName, false);
    await checkBattleEnd();
  }
}

function openPartyModal(forced) {
  if (!forced && state.isBusy) return;
  const modal = document.getElementById('modal');
  document.getElementById('modal-title').innerText = '포켓몬 교체';
  document.getElementById('modal-desc').innerText = '전투에 내보낼 포켓몬을 선택하세요.';

  const list = document.getElementById('modal-list');
  list.innerHTML = '';

  state.party.forEach((poke, idx) => {
    const btn = document.createElement('button');
    btn.style.background = idx === state.activeIdx ? '#2c3e50' : '#0f3460';
    btn.style.color = '#fff';
    btn.style.border = '1px solid #e94560';
    btn.disabled = (poke.hp <= 0 || idx === state.activeIdx);
    btn.innerText = `${poke.name} (Lv.${poke.level}) - HP: ${poke.hp}/${poke.maxHp}`;
    btn.onclick = () => {
      state.activeIdx = idx;
      modal.style.display = 'none';
      log(`가랏! ${poke.name}!`);
      state.isBusy = false;
      updateUI();
    };
    list.appendChild(btn);
  });

  if (!forced) {
    const closeBtn = document.createElement('button');
    closeBtn.style.background = '#555';
    closeBtn.style.color = '#fff';
    closeBtn.innerText = '닫기';
    closeBtn.onclick = () => { modal.style.display = 'none'; };
    list.appendChild(closeBtn);
  }

  modal.style.display = 'flex';
}
